name: "CI"

on:
  workflow_dispatch:
    inputs:
      enableUpterm:
        description: "Enable the Upterm server for debugging workflows in-flight"
        required: true
        default: false
        type: boolean
      breakOnJob:
        description: "Break on a specific job, to be used with the `enableUpterm` input"
        required: false
        type: choice
        options:
          - "nix-plugins-dev"
          - "cli-unit"
          - "nix-build"
          - "trigger-flox-installers-workflow"
          - "report-failure"
          - "nix-build-bats-tests"
      allowedUptermUsers:
        description: "Comma-separated list of GitHub users allowed to access the Upterm server"
        required: false
        type: string
        default: "bryanhonof,tomberek,garbas"
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:
  merge_group:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.sha }}"
  cancel-in-progress: true

env:
  # Also set in setup_suite.bash but set here for consistency
  FLOX_DISABLE_METRICS: "true"
  # "true" when this run is part of cutting a release, i.e. the PR from a
  # `release-*` branch to `main`, or a PR backporting into a `release-*`
  # branch.  Some invariants only hold once `VERSION` has been bumped, which
  # happens on the release branch; tests assert those only when this is set.
  # `head_ref`/`base_ref` are empty outside `pull_request`, so pushes to `main`
  # and tag pushes correctly yield "false".
  FLOX_RUNNING_RELEASE: "${{ startsWith(github.head_ref, 'release-') || startsWith(github.base_ref, 'release-') }}"

jobs:
  # Classify the change under test so the expensive jobs below can no-op on
  # changes that cannot possibly affect them — most importantly, so that a
  # documentation-only pull request does not occupy the shared remote Darwin
  # builders.
  #
  # This job is deliberately *not* a gate. Nothing below is skipped at the job
  # level on the strength of its output: every required check still runs and
  # still posts a status, and only the steps inside those jobs are gated.
  #
  # That is not a precaution against a hypothetical — it is a verified property
  # of this repository. A job-level skip does not post the per-leg contexts the
  # branch protection requires: on fork PR #4488, skipping `nix-build` at the
  # job level produced exactly one check run named `Nix build`, with no matrix
  # suffix and zero per-leg contexts; all four `Nix build (<system>)` contexts
  # on that commit came from the separate community-ci run. 14 of the 16
  # contexts in the `Main ruleset` are matrix legs owned by the four jobs gated
  # here, so a job-level skip does not leave a required context pending — it
  # means the context is never *created*, and the merge queue ejects the pull
  # request on a status-check timeout.
  #
  # It runs on every event, so both outputs are always an explicit
  # "true"/"false" rather than the empty string a skipped job yields.
  scope:
    name: "Scope"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      heavy: "${{ steps.classify.outputs.heavy }}"
      # Controls whether to build and test x86_64-darwin.
      # `"false"` iff the platform should be skipped.
      x86-darwin: "${{ steps.x86-darwin.outputs.x86-darwin }}"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # `git merge-base` needs history on both sides of the comparison, so
          # the depth has to stay: a shallow clone makes `merge-base` fail,
          # which lands on `heavy=true` and turns this into a silent no-op gate.
          fetch-depth: 0
          # The classifier reads path names and commit topology, never file
          # contents, so the ~36 MiB of blobs across ~5800 commits is pure cost
          # on the critical path of four jobs. `blob:none` rather than `tree:0`
          # because `actions/checkout` materialises a working tree, and `tree:0`
          # would force that back out as on-demand tree fetches.
          filter: "blob:none"

      - name: "Verify the classifier"
        # Canary, not a test suite: a pull request that widens the allowlist
        # necessarily edits `classify-ci-scope.sh`, which is itself always
        # heavy, so this runs against the change that could break it. Keeping
        # `GITHUB_OUTPUT`/`GITHUB_STEP_SUMMARY` empty stops the canary writing
        # a verdict into either.
        env:
          GITHUB_OUTPUT: ""
          GITHUB_STEP_SUMMARY: ""
        run: |
          printf 'cli/flox/src/main.rs\n' |
            ./.github/scripts/classify-ci-scope.sh --classify-only |
            grep -qx 'heavy=true'
          printf 'README.md\ndocs/guide.md\n' |
            ./.github/scripts/classify-ci-scope.sh --classify-only |
            grep -qx 'heavy=false'
          printf 'cli/flox/doc/manifest.toml.md\n' |
            ./.github/scripts/classify-ci-scope.sh --classify-only |
            grep -qx 'heavy=true'

      - name: "Classify the diff"
        id: "classify"
        # Context values are passed via `env:` and referenced as shell
        # variables rather than interpolated directly into `run:`, to avoid
        # script injection from attacker-controlled values such as branch names.
        env:
          MERGE_GROUP_BASE_SHA: "${{ github.event.merge_group.base_sha }}"
          PR_BASE_REF: "${{ github.base_ref }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: ./.github/scripts/classify-ci-scope.sh

      - name: "Should this run spend time on x86_64-darwin?"
        id: "x86-darwin"
        # x86_64-darwin is ~3% of users and rarely breaks on its own, so CI
        # only pays for it where an x86-only regression would reach users:
        # release-branch pull requests. `FLOX_RUNNING_RELEASE` is
        # reused rather than recomputed, so changing it changes this too.
        env:
          EVENT_NAME: "${{ github.event_name }}"
        run: |
          case "$EVENT_NAME" in
            pull_request | merge_group) X86_DARWIN="$FLOX_RUNNING_RELEASE" ;;
            *) X86_DARWIN="true" ;;
          esac
          echo "x86-darwin=$X86_DARWIN" >> "$GITHUB_OUTPUT"
          echo "\`x86-darwin=$X86_DARWIN\`" >> "$GITHUB_STEP_SUMMARY"

  nix-plugins-dev:
    name: "Nix Plugins"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    needs:
      - "scope"

    # See `scope`: this job always runs, and only its steps are gated. The step
    # conditions below default to running whenever `scope` did not explicitly
    # report `heavy=false`, which covers a failed `scope`.
    #
    # The push-to-main exclusion below is unrelated to `scope` and doesn't hit
    # the branch-protection problem `scope` documents: it only applies to the
    # `push` event, which isn't gated by required status checks (the commit
    # already passed them in the merge queue before landing on main), so a
    # job-level skip here is safe. Nothing here needs to warm a cache the way
    # `cli-unit`'s Cargo cache does, so the whole job is skipped outright.
    if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-22.04-8core"
          - "macos-14-xlarge"

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Setup"
        if: ${{ needs.scope.outputs.heavy != 'false' }}
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"

      - name: "Build"
        if: ${{ needs.scope.outputs.heavy != 'false' }}
        run: nix develop -L --no-update-lock-file --command just build-nix-plugins

      - name: "Test"
        if: ${{ needs.scope.outputs.heavy != 'false' }}
        run: nix develop -L --no-update-lock-file --command just test-nix-plugins

  nef-dev:
    name: "Nix expression tests"
    # Skip on push to main; already run in the merge queue. Safe as a job-level
    # skip (see `nix-plugins-dev`): `push` isn't subject to required status
    # checks, so this doesn't hit the branch-protection issue `scope` guards
    # against.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: "ubuntu-22.04-8core"
    timeout-minutes: 15 # eval only tests should be plenty fast

    permissions:
      contents: read

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Setup"
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"

      - name: "Test NEF"
        run: nix develop -L --no-update-lock-file --command just test-nef

      - name: "Test buildenvLib"
        run: nix develop -L --no-update-lock-file --command just test-buildenvLib

  cli-unit:
    name: "unit"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    needs:
      - "scope"

    # See `nix-plugins-dev`: always runs, only its steps are gated.
    #
    # Unlike `nix-plugins-dev`/`nef-dev`, this job is NOT job-skipped on push
    # to main: the "Build" step below writes the Cargo cache, and caches are
    # only ever refreshed by the branch that ran them. Skipping the whole job
    # on main would leave every new PR branch without a warm cache to restore
    # via `restore-keys`. Only the "CLI Unit Tests" and "Check schemas" steps
    # (the actually-redundant parts, already covered by the merge queue) are
    # skipped on push to main below.
    if: ${{ !cancelled() }}

    permissions:
      id-token: write # Needed for CodeCov

    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-22.04-8core"
          - "macos-14-xlarge"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Setup"
        if: ${{ needs.scope.outputs.heavy != 'false' }}
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"

      - name: "Cache Cargo"
        if: ${{ needs.scope.outputs.heavy != 'false' }}
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: "cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}"
          restore-keys: "cargo-${{ runner.os }}-"

      - name: "Build"
        if: ${{ needs.scope.outputs.heavy != 'false' }}
        run: nix develop -L --no-update-lock-file --command just build-cli

      - name: "CLI Unit Tests"
        # Only run unit tests if when not running specialized integration tests
        # Also skip on push to main; already run in the merge queue. The
        # "Build" step above still runs unconditionally (subject only to
        # `scope`) so the Cargo cache above stays warm for new branches to
        # restore from — caches are only ever written by the job that ran
        # them, so without a job running here on main, `restore-keys` would
        # never have anything fresh to fall back to.
        id: unit-tests
        if: ${{ needs.scope.outputs.heavy != 'false' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          RUST_BACKTRACE: 1
        run: nix develop -L --no-update-lock-file --command just impure-tests

      - name: "Check schemas are up to date"
        # Skip on push to main; already run in the merge queue.
        if: ${{ needs.scope.outputs.heavy != 'false' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          nix develop -L --no-update-lock-file --command just gen-schemas
          if ! git diff --quiet cli/schemas; then
            echo "::error::Schema files are not up to date. Please run 'just gen-schemas' and commit the changes."
            git status
            git diff
            exit 1
          fi

  nix-build:
    name: "Nix build"
    # Fork PRs can't access the AWS OIDC / Tailscale secrets this job needs, so
    # it can only fail. The required "Nix build (*)" contexts are posted on the
    # same commit by the maintainer-run community-ci draft PR (CONTRIBUTING.md).
    # Pushes, merge-queue runs, and same-repo PRs are unaffected.
    #
    # See `scope`: `!cancelled()` keeps the pre-existing fork condition as the
    # *only* reason this job is ever skipped.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: "ubuntu-latest"
    timeout-minutes: 120

    needs:
      - "scope"

    permissions:
      id-token: write # Needed for AWS Creds

    outputs:
      closure-size-x86_64-linux: ${{ steps.closure.outputs.closure-size-x86_64-linux }}
      closure-size-aarch64-linux: ${{ steps.closure.outputs.closure-size-aarch64-linux }}
      closure-size-x86_64-darwin: ${{ steps.closure.outputs.closure-size-x86_64-darwin }}
      closure-size-aarch64-darwin: ${{ steps.closure.outputs.closure-size-aarch64-darwin }}
      flox-version: ${{ steps.version.outputs.flox-version }}

    # Keep `x86_64-darwin` here even when it doesn't build: dropping it would
    # stop *creating* a required context, not just skip it (see `scope`).
    strategy:
      fail-fast: false
      matrix:
        system:
          - "x86_64-linux"
          - "x86_64-darwin"
          - "aarch64-linux"
          - "aarch64-darwin"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        # needed for git describe to work
        with:
          fetch-depth: 0

      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Setup"
        if: ${{ needs.scope.outputs.heavy != 'false' && (matrix.system != 'x86_64-darwin' || needs.scope.outputs.x86-darwin != 'false') }}
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"
          TAILSCALE_URL: "${{ vars.MANAGED_TAILSCALE_URL }}"
          TAILSCALE_AUTH_KEY: "${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}"
          REMOTE_BUILDERS: "${{ vars.MANAGED_REMOTE_BUILDERS }}"
          SYSTEM: "${{ matrix.system }}"
          SETUP_NIX: "false"

      - name: "Configure AWS Credentials"
        if: ${{ needs.scope.outputs.heavy != 'false' && (matrix.system != 'x86_64-darwin' || needs.scope.outputs.x86-darwin != 'false') }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
        with:
          role-to-assume: "arn:aws:iam::759020684799:role/github-oidc-role-flox-cache-public"
          role-session-name: "${{ github.run_id }}"
          aws-region: "us-east-1"
          output-env-credentials: true
          unset-current-credentials: true

      - name: "Build"
        id: "build"
        if: ${{ needs.scope.outputs.heavy != 'false' && (matrix.system != 'x86_64-darwin' || needs.scope.outputs.x86-darwin != 'false') }}
        env:
          # S3 on purpose, not R2: this is the destination the builders
          # publish the product closures to, and cache.flox.dev serves them
          # from there to users, flox-installers, and the bats test builders.
          NIX_SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_S3_BUCKET }}"
          NIX_SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
        run: |
          export AWS_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY
          export AWS_SESSION_TOKEN
          export NIX_SUBSTITUTER_KEY

          for package in 'packages.${{ matrix.system }}.flox-nix-plugins' 'packages.${{ matrix.system }}.flox-cli' 'packages.${{ matrix.system }}.flox' 'packages.${{ matrix.system }}.flox-cli-tests'; do
            echo "::group::Building $package"
            ./.github/scripts/remote-execute-nix-build.sh "$package" "$NIX_SUBSTITUTER"
            echo "::endgroup::"
          done

      - name: "Get Flox version"
        id: "version"
        run: |
          FLOX_VERSION="${FLOX_VERSION:=$(git describe)}"
          FLOX_VERSION="${FLOX_VERSION:1}"
          echo "flox-version=$FLOX_VERSION" >> $GITHUB_OUTPUT

  trigger-flox-installers-workflow:
    name: "Build installers"
    if: ${{ (github.base_ref == 'refs/heads/main' || github.ref == 'refs/heads/main') && github.event_name == 'push' }}
    runs-on: "ubuntu-latest"
    timeout-minutes: 120

    needs:
      - "nix-build"

    steps:
      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Trigger flox-installers workflow"
        id: "trigger-workflow"
        uses: convictional/trigger-workflow-and-wait@f69fa9eedd3c62a599220f4d5745230e237904be # v1.6.5
        with:
          owner: "flox"
          repo: "flox-installers"
          github_token: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          github_user: "floxbot"
          workflow_file_name: "ci.yml"
          ref: "${{ github.ref_name }}"
          wait_interval: 10
          client_payload: '{"FLOX_SRC":"github:flox/flox/${{ github.event.pull_request.head.sha || github.sha }}"}'
          propagate_failure: true
          trigger_workflow: true
          wait_workflow: true

      - name: "Create shipit artifact"
        if: ${{ success() || failure() }}
        run: |
          jq -n \
            --arg "flox_installers_workflow_id" "${{ steps.trigger-workflow.outputs.workflow_id }}" \
            --arg "flox_closure_size-x86_64-linux" "${{ needs.nix-build.outputs.closure-size-x86_64-linux }}" \
            --arg "flox_closure_size-aarch64-linux" "${{ needs.nix-build.outputs.closure-size-aarch64-linux }}" \
            --arg "flox_closure_size-x86_64-darwin" "${{ needs.nix-build.outputs.closure-size-x86_64-darwin }}" \
            --arg "flox_closure_size-aarch64-darwin" "${{ needs.nix-build.outputs.closure-size-aarch64-darwin }}" \
            --arg "flox_version" "${{ needs.nix-build.outputs.flox-version }}" \
            '$ARGS.named' > shipit.json
          cat shipit.json | jq

      - name: "Upload artifact"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: ${{ success() || failure() }}
        with:
          name: "shipit"
          path: "shipit.json"

  report-failure:
    name: "Report Failure"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    if: ${{ failure() && (github.base_ref == 'refs/heads/main' || github.ref == 'refs/heads/main') && github.event_name == 'push' }}

    # nix-build and cli-unit still run on push to main (see their `if`
    # conditions); nix-plugins-dev, nef-dev, and nix-build-bats-tests are
    # skipped there, so they're dropped from `needs` — a skipped job's result
    # isn't a `failure()` anyway, but keeping stale deps out avoids implying
    # they're expected to run.
    needs:
      - "nix-build"
      - "cli-unit"

    steps:
      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Slack Notification"
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        env:
          SLACK_TITLE: "Something broke CI for flox/flox on ${{ github.ref_name }}"
          SLACK_FOOTER: "Thank you for caring"
          SLACK_WEBHOOK: "${{ secrets.MANAGED_SLACK_WEBHOOK }}"
          SLACK_USERNAME: "GitHub"
          SLACK_ICON_EMOJI: ":poop:"
          SLACK_COLOR: "#ff2800" # ferrari red -> https://encycolorpedia.com/ff2800
          SLACK_LINK_NAMES: true

  nix-build-bats-tests:
    name: "remote"
    runs-on: "ubuntu-latest"
    timeout-minutes: 90

    permissions:
      id-token: write # Needed for CodeCov

    needs:
      - "scope"
      - "nix-build"

    # See `scope`. Spelled out rather than left implicit because without a
    # status-check function GitHub adds `success()` over *every* `needs`:
    # `nix-build` succeeding is the only precondition, exactly as before, and a
    # skipped `nix-build` (fork PR) still skips this job.
    #
    # Also skipped outright on push to main; already run in the merge queue.
    # See `nix-plugins-dev` for why a job-level skip is safe here specifically
    # for the `push` event.
    if: ${{ !cancelled() && needs.nix-build.result == 'success' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    strategy:
      fail-fast: false
      matrix:
        system:
          - "x86_64-linux"
          - "x86_64-darwin"
          - "aarch64-linux"
          - "aarch64-darwin"
        test-tags:
          - "containerize"
          - "!containerize"
        exclude:
          # Skip containerize tests on x86_64-darwin (except the ones enabled in the include section below)
          - system: "x86_64-darwin"
        include:
          # Disable containerize and activation tests on x86_64-darwin
          # Containerize tests are run through rosetta, and thus are slow and dont necessarily represent real usage.
          # Activation tests are taking the largest part of test runtime (up to ~10 minutes)
          # we disable these in an effort to speed up CI.
          # We assume that activation is sufficiently tested on macos through aarch64-darwin
          # and on x86_64-darwin through the remaining integration tests
          - system: "x86_64-darwin"
            test-tags: "!containerize,!activate"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup upterm session"
        if: ${{ (true == inputs.enableUpterm) && (inputs.breakOnJob == github.job) }}
        uses: owenthereal/action-upterm@f26ebc11e22a09b8365f39d2cdafd06f63b42053 # v1
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ inputs.allowedUptermUsers }}
          wait-timeout-minutes: 15

      - name: "Setup"
        if: ${{ needs.scope.outputs.heavy != 'false' && (matrix.system != 'x86_64-darwin' || needs.scope.outputs.x86-darwin != 'false') }}
        uses: "./.github/actions/common-setup"
        with:
          GITHUB_ACCESS_TOKEN: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          SUBSTITUTER: "${{ vars.MANAGED_CACHE_PUBLIC_R2_BUCKET }}"
          SUBSTITUTER_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_SECRET_KEY }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MANAGED_CACHE_PUBLIC_R2_SECRET_ACCESS_KEY }}"
          SSH_KEY: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"
          TAILSCALE_URL: "${{ vars.MANAGED_TAILSCALE_URL }}"
          TAILSCALE_AUTH_KEY: "${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}"
          REMOTE_BUILDERS: "${{ vars.MANAGED_REMOTE_BUILDERS }}"
          SYSTEM: "${{ matrix.system }}"

      - name: "Run Bats Tests (./#flox-cli-tests)"
        timeout-minutes: 30
        if: ${{ needs.scope.outputs.heavy != 'false' && (matrix.system != 'x86_64-darwin' || needs.scope.outputs.x86-darwin != 'false') }}
        env:
          MATRIX_SYSTEM: ${{ matrix.system }}
          MATRIX_TEST_TAGS: ${{ matrix.test-tags }}
        run: ./.github/scripts/remote-execute-integration-tests.sh
