# Goal 1: run a service entirely from a Flox environment.
#
# Install as /etc/flox/services/myservice.conf, then:
#   systemctl enable --now flox@myservice.service
#   systemctl enable --now flox-autopull@myservice.timer   # optional

# The FloxHub environment to run. Required.
FLOX_ENVIRONMENT=flox/echoip

# Pass --trust when activating. Needed for environments with hooks or
# non-default build behavior that flox would otherwise prompt about.
FLOX_TRUST=1

# Root-readable file containing a FloxHub token, used for the pull. To make
# the token available to the activation as well, add a drop-in:
#   systemctl edit flox@myservice.service
#   [Service]
#   LoadCredential=floxhub_token:/etc/flox/services/myservice.token
FLOX_TOKEN_FILE=/etc/flox/services/myservice.token

# Refresh the environment on every service start. The initial provisioning
# pull always happens regardless; a failed refresh of an already-provisioned
# environment does not prevent the service from starting.
FLOX_PULL_AT_SERVICE_START=1

# Restart the service when a scheduled pull fetches a new generation.
# Without this a pulled update only takes effect on the next restart.
FLOX_AUTORESTART=1

# Account to run as. Defaults to flox-<instance>, created on first pull.
# If you change these, add a matching drop-in setting User=/Group= on the
# unit - systemd cannot read them from this file.
#FLOX_USER=
#FLOX_GROUP=

# Extra arguments. Each is a shell-quoted argument list: the value is split
# into arguments, and an argument containing whitespace is quoted within it
# (FLOX_ACTIVATE_ARGS="--mode 'dev mode'").
#FLOX_ARGS="-v -v"
#FLOX_ACTIVATE_ARGS="--mode dev"
#FLOX_PULL_ARGS=
