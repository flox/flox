# Drop-in overriding an existing unit to run from a Flox environment.
#
# Install with:
#   systemctl edit echoip.service
# or as /etc/systemd/system/echoip.service.d/10-flox.conf
#
# `systemctl revert echoip.service` removes it again.

[Unit]
# Provision and refresh the environment before the service starts.
After=flox-pull@echoip.service
Requires=flox-pull@echoip.service

[Service]
# The empty assignment resets the vendor unit's ExecStart. A unit with
# several ExecStart= lines needs all of them re-listed after the reset.
ExecStart=
ExecStart=/usr/libexec/flox/flox-exec-start echoip

# Vendor units are commonly hardened with ProtectSystem=strict; the
# activation must still be able to write its working directory and reach the
# nix daemon.
ReadWritePaths=/var/lib/flox/echoip /nix/var/nix/daemon-socket

# Optional: make the FloxHub token available to the activation.
#LoadCredential=floxhub_token:/etc/flox/services/echoip.token
