# Goal 2: override what an existing unit runs, without touching its own
# hardening, Restart= or ordering.
#
# Install as /etc/flox/services/echoip.conf alongside the drop-in in
# examples/echoip-override.dropin.conf, then:
#   systemctl daemon-reload
#   systemctl restart echoip.service
#
# The instance name must match the unit name: the drop-in on echoip.service
# passes "echoip" to flox-exec-start, which reads this file.

FLOX_ENVIRONMENT=flox/echoip
FLOX_TRUST=1

# The command to run inside the activated environment, replacing the unit's
# own ExecStart. Interpreted by /bin/sh.
FLOX_EXEC_START="echoip -l 127.0.0.1:8080 -H X-Real-IP"

# Must match the User=/Group= the vendor unit already runs as, so the pull
# provisions the working directory for the right account.
FLOX_USER=echoip
FLOX_GROUP=echoip

FLOX_TOKEN_FILE=/etc/flox/services/echoip.token
FLOX_AUTORESTART=1

# The unit to restart when a scheduled pull fetches a new generation. Method 1
# defaults this to flox@<name>.service; an override targets the existing unit.
FLOX_UNIT=echoip.service
