    "description": "# Flox Markdown Renderer Bake-Off\n\nEvery construct the four backends are compared on, in one description:\n**bold**, *italic*, ~~strikethrough~~, and inline `code`, all in this\nsentence.\n\n## Getting Started\n\n1. Clone the repository\n2. Run `flox activate`\n   - Installs every declared package\n   - Exports the manifest's `[vars]`\n   - Runs the `[hook]` script, if any\n3. Start hacking\n\n### A Third-Level Heading\n\nHeading levels are the open question. The three levels above exist so\nthe backends can be compared on whether -- and how -- each one\ndistinguishes a level from the next.\n\n```python\ndef greet(name: str) -> str:\n    return f\"Hello, {name}!\"\n```\n\nThat fenced block carries a language tag, so the syntax-highlighting\nbackends have something to color; the builtin renderer and gum are not\nexpected to highlight it.\n\n> Descriptions are Markdown, so a block quote should render as a quote\n> in every backend, not as a plain paragraph.\n\n| Backend | Syntax highlighting | Extra dependency     |\n| ------- | ------------------- | -------------------- |\n| builtin | no                  | none                 |\n| mdcat   | yes                 | pulldown-cmark-mdcat |\n| glow    | yes                 | glow binary          |\n| gum     | no                  | gum binary           |\n\nThe builtin renderer degrades that table to plain text, and this\nparagraph runs well past the standard eighty-column terminal width so\nthe backends can be compared on how -- and whether -- each one wraps\nordinary prose onto a second line.\n\nCJK characters, two columns each: 宽字符宽字符宽字符宽字符\nCombining marks (\"e\" plus a combining acute, not precomposed): ééé\nEmoji, including a four-codepoint ZWJ family sequence: 👨‍👩‍👧‍👦 and 🎉\n\nSee the [Flox manifest reference](https://flox.dev/docs/reference/command-reference/manifest.toml/)\nfor the full set of fields.\n",
    "options": {}
  },
