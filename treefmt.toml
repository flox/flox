# One CLI to format the code tree - https://git.numtide.com/numtide/treefmt

[formatter.nix]
# Formatter to run
command = "nixfmt"
# Command-line arguments for the command
options = []
# Glob pattern of files to include
includes = [ "*.nix" ]
# Glob patterns of files to exclude.
# These two fixtures hold deliberately invalid Nix so the lock scanner's
# parse-error paths can be exercised. nixfmt cannot read them.
excludes = [
  "cli/nef-lock-catalog/test_data/catalog_refs/invalid-syntax.nix",
  "cli/nef-lock-catalog/test_data/catalog_refs/parse-error-import/broken.nix",
]


[formatter.yaml]
# Formatter to run
command = "yamlfmt"
# Command-line arguments for the command
options = []
# Glob pattern of files to include
includes = [ "*.yml", "*.yaml" ]
# Glob patterns of files to exclude
excludes = [ "test_data/**" ]
