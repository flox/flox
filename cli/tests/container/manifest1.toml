version = 1

[install]
hello.pkg-path = "hello"

[vars]
foo = "bar"

[hook]
on-activate = """
    command -v hello
    hello
"""

# Pin the systems this manifest's packages were recorded for so resolution
# replays match the recordings on every machine.
[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-darwin", "x86_64-linux"]
