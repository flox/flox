version = 1

[vars]
# Redis requires this but it's unset on some of our runners/builders.
LANG = "en_US.UTF-8"

[install]
redis.pkg-path = "redis"
netcat.pkg-path = "netcat"

[hook]
on-activate = """
source "${TESTS_DIR}/services/portgrab.sh"
REDIS_PORT="$(flox_portgrab)"
export REDIS_PORT
"""

[services.redis]
command = 'redis-server --port "${REDIS_PORT}"'

# Pin the systems this manifest's packages were recorded for so resolution
# replays match the recordings on every machine.
[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-darwin", "x86_64-linux"]
