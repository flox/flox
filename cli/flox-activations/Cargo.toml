[package]
name = "flox-activations"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
flate2.workspace = true
clap = { version = "4.5.56", default-features = false, features = [
    "std",
    "usage",
    "help",
    "error-context",
    "derive",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
tracing-appender = "0.2"
flox-core.workspace = true
fslock.workspace = true
glob = "0.3.3"
nix.workspace = true
sentry.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-escape.workspace = true
signal-hook.workspace = true
time = { workspace = true, features = ["macros"] }
indoc.workspace = true
is_executable.workspace = true
itertools.workspace = true
shell_gen = { path = "../shell_gen" }
dirs.workspace = true
tempfile.workspace = true
uuid.workspace = true
waitpid-any = "0.3.0"
# Pinned to a 9.0.0 release candidate for macOS: only since 9.0.0-rc.2 does
# notify create its FSEvents stream with kFSEventStreamCreateFlagWatchRoot,
# without which removing an ancestor of the watched directory produces no
# event at all. Drop the pre-release pin once 9.0.0 is out.
notify = "9.0.0-rc.4"

[target.'cfg(target_os = "macos")'.dependencies]
kqueue.workspace = true

[dev-dependencies]
flox-core = { workspace = true, features = ["tests"] }
nix.workspace = true
temp-env.workspace = true
pretty_assertions.workspace = true
expect-test.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
procfs = "0.18.0"
